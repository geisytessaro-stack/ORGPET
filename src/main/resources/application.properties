spring.application.name=sistema

# Banco MySQL configurado pelas variáveis do docker-compose.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:pet}
spring.datasource.username=${DB_USER:pet}
spring.datasource.password=${DB_PASSWORD:sofrida}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# As tabelas já existem; o Hibernate apenas as utiliza.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
