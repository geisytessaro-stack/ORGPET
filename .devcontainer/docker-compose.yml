services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu

    volumes:
      - ..:/workspace:cached

    command: sleep infinity

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: pet
      DB_USER: pet
      DB_PASSWORD: sofrida

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: pet
      MYSQL_USER: pet
      MYSQL_PASSWORD: sofrida
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mysql-data: